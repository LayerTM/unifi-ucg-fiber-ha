  <!-- wordmark -->
  <text x="360" y="150" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="82" font-weight="700" fill="#FFFFFF" letter-spacing="-1">UniFi Gateway</text>
  <text x="362" y="212" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#EAFCFF" opacity="0.92">Non-invasive gateway &amp; WAN monitoring for Home Assistant</text>
