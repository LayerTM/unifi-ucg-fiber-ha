# Run: pip install pre-commit && pre-commit install
repos:
  - repo: local
    hooks:
      - id: secret-scan
        name: secret / PII scan (block device data)
        entry: python scripts/secret_scan.py
        language: system
        pass_filenames: false
        always_run: true
      - id: hygiene-scan
        name: hygiene scan (no traces of one machine)
        entry: python scripts/hygiene_scan.py
        language: system
        pass_filenames: false
        always_run: true
      - id: vendor-sync
        name: aiounifigw vendored copy in sync with src/
        entry: python scripts/vendor_aiounifigw.py
        language: system
        pass_filenames: false
        files: ^src/aiounifigw/

      # The ruff that `.github/ci-tools/requirements.txt` installs, so the hook
      # and CI cannot disagree about the version.
      - id: ruff
        name: ruff
        entry: ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types_or: [python, pyi]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=512]
