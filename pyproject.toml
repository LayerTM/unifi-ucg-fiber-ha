[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiounifigw"
version = "0.1.4"
description = "Async client for the Ubiquiti UniFi OS gateway (UCG-Fiber / UCG / UDM / UXG) local REST API — non-invasive monitoring with opt-in control."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "LayerTM" }]
keywords = ["ubiquiti", "unifi", "ucg", "ucg-fiber", "gateway", "wan", "home-assistant", "async"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = ["aiohttp>=3.9", "yarl>=1.9"]

[project.optional-dependencies]
cli = ["typer>=0.12", "rich>=13"]              # unifi-gateway CLI
mcp = ["mcp>=1.28,<2"]                            # unifi-gateway-mcp server
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "mypy>=1.11",
  "ruff>=0.6",
]
# Home Assistant integration dev/test. Requires Python 3.14 (HA 2026.6+).
ha = [
  "pytest-homeassistant-custom-component>=0.13.300",
]

[project.urls]
Homepage = "https://github.com/LayerTM/unifi-ucg-fiber-ha"
Issues = "https://github.com/LayerTM/unifi-ucg-fiber-ha/issues"
Documentation = "https://github.com/LayerTM/unifi-ucg-fiber-ha/blob/main/docs/API.md"

[project.scripts]
unifi-gateway = "aiounifigw.cli:main"
unifi-gateway-mcp = "aiounifigw.mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aiounifigw"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "custom_components", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF", "PTH", "TID"]

[tool.mypy]
# Library (aiounifigw) targets 3.12+. The HA integration is checked separately
# with `mypy --python-version 3.14 custom_components/unifi_gateway_rest` (needs
# HA + newer syntax), since Home Assistant itself requires Python 3.14.
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
files = ["src/aiounifigw"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/aiounifigw", "custom_components/unifi_gateway_rest"]
# The vendored client is a copy of src/aiounifigw and is covered by the library
# suite (tests/); exclude it from the integration-suite measurement.
omit = ["*/custom_components/unifi_gateway_rest/aiounifigw/*"]
