[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiounifigw"
dynamic = ["version"]
description = "Async client for the Ubiquiti UniFi OS gateway (UCG-Fiber / UCG / UDM / UXG) local REST API — non-invasive monitoring with opt-in control."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "LayerTM" }]
keywords = ["ubiquiti", "unifi", "ucg", "ucg-fiber", "gateway", "wan", "home-assistant", "async"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = ["aiohttp>=3.9", "yarl>=1.9"]

[project.optional-dependencies]
cli = ["typer>=0.12", "rich>=13"]              # unifi-gateway CLI
mcp = ["mcp>=2"]                                  # unifi-gateway-mcp server
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "mypy>=1.11",
  "ruff>=0.6",
]
# Home Assistant integration dev/test. The harness pins a Home Assistant that
# requires Python 3.14.2, while the library itself supports 3.12+ — so the
# marker is what makes this extra resolvable across the whole `requires-python`
# range. Without it a universal resolver (uv) correctly reports the project as
# unsatisfiable; pip only ever noticed because it resolves for one interpreter.
ha = [
  "pytest-homeassistant-custom-component>=0.13.300; python_full_version >= '3.14.2'",
]

[project.urls]
Homepage = "https://github.com/LayerTM/unifi-ucg-fiber-ha"
Issues = "https://github.com/LayerTM/unifi-ucg-fiber-ha/issues"
Documentation = "https://github.com/LayerTM/unifi-ucg-fiber-ha/blob/main/docs/API.md"

[project.scripts]
unifi-gateway = "aiounifigw.cli:main"
unifi-gateway-mcp = "aiounifigw.mcp:main"

# The version is stated once, in the integration manifest — the file Home
# Assistant and HACS read, and the one a release tag is cut from. Repeating
# it in the package is what let three files disagree (0.1.7 / 0.1.6 / 0.1.3).
[tool.hatch.version]
path = "custom_components/unifi_gateway_rest/manifest.json"
pattern = '"version":\s*"(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/aiounifigw"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "custom_components", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF", "PTH", "TID"]

[tool.mypy]
# Library (aiounifigw) targets 3.12+. The HA integration is checked separately
# with `mypy --python-version 3.14 custom_components/unifi_gateway_rest` (needs
# HA + newer syntax), since Home Assistant itself requires Python 3.14.
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
files = ["src/aiounifigw"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
testpaths = ["tests"]
# Python's own deprecation channel, which no log watcher can see.
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["src/aiounifigw", "custom_components/unifi_gateway_rest"]
# The vendored client is a copy of src/aiounifigw and is covered by the library
# suite (tests/); exclude it from the integration-suite measurement.
omit = ["*/custom_components/unifi_gateway_rest/aiounifigw/*"]

[tool.coverage.report]
# Compare `--cov-fail-under` against the real total, not the rounded one. At the
# default precision coverage rounds first, so a 95.6% project displays — and
# compares — as 96, and a threshold of 96 passes on code that never reached it.
precision = 2
