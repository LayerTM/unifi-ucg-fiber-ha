name: hygiene

on:
  push:
  pull_request:

# Every `run:` under a pipefail shell: GitHub's default returns only the last
# command of a pipe, so a failing producer would leave the step green.
defaults:
  run:
    shell: bash

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Self-test the hygiene scanner
        run: python scripts/test_hygiene_scan.py
      - name: Scan the tracked files for traces of one machine
        run: python scripts/hygiene_scan.py .
