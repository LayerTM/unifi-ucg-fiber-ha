name: hygiene

on:
  push:
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Self-test the hygiene scanner
        run: python scripts/test_hygiene_scan.py
      - name: Scan the tracked files for traces of one machine
        run: python scripts/hygiene_scan.py .
