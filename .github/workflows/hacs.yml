name: hacs

on:
  push:
  pull_request:
  schedule:
    - cron: "30 4 * * *"

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # hacs/action is a Docker action, so the runner pulls ghcr.io/hacs/action
      # while it sets the job up, before the first step. No step in this job can
      # fetch that image ahead of the runner, the way hassfest.yml does.
      - uses: hacs/action@main
        with:
          category: integration
          # Brand icons ship in-repo (custom_components/unifi_gateway_rest/brand/):
          # since HA 2026.3 custom integrations provide their own icons and are no
          # longer added to home-assistant/brands.
