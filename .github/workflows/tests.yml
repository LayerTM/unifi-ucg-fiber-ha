name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,cli,mcp]"
      - name: Type check (strict)
        # No path argument: an explicit one OVERRIDES `files =` in pyproject.toml,
        # so the config could widen its scope while CI kept checking the old set.
        run: mypy --strict
      - name: Tests + coverage gate
        run: pytest --cov=aiounifigw --cov-report=term-missing --cov-fail-under=90
