# Dependabot configuration.
#
# Groups intentionally omit `update-types`: with patterns:["*"], adding an
# update-types filter silently suppresses major-version PRs upstream
# (dependabot/dependabot-core#14202). Majors therefore group in with
# minor/patch and are reviewed like any other pull request.
#
# `hacs/action@main` and `home-assistant/actions/hassfest@master` track a
# branch, which Dependabot cannot version — both are pinned that way because
# their upstreams document no other reference. They stay outside these updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels: ["dependencies"]
    groups:
      github-actions:
        patterns: ["*"]

  # The uv ecosystem owns both `pyproject.toml` and `uv.lock`. The pip
  # ecosystem reads only the former and never refreshes the lock, which lets the
  # lock fall behind while its pins keep being reported as vulnerable. The lock
  # pins exactly what Home Assistant pins (the test harness requires one exact
  # Home Assistant release), so a fix for one of those pins arrives with a newer
  # Home Assistant in this grouped update rather than as a single-package one.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    labels: ["dependencies"]
    groups:
      python-dependencies:
        patterns: ["*"]
